[package]
name = "supplymize-optimizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Explainable supply-chain network optimization service for SupplyMize"
license = "MIT"
publish = false

[lib]
name = "supplymize_optimizer"
path = "src/lib.rs"

[[bin]]
name = "supplymize-optimizer"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["json", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["limit", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
