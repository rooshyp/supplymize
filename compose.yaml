name: supplymize

services:
  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    image: supplymize/console:local
    ports:
      - "4173:8080"
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped
    networks: [edge]

  control-plane:
    build:
      context: services/control-plane
    image: supplymize/control-plane:local
    environment:
      SUPPLYMIZE_ENV: development
      SUPPLYMIZE_HTTP_ADDR: ":8080"
      SUPPLYMIZE_FORECAST_URL: http://forecasting:8001
      SUPPLYMIZE_OPTIMIZER_URL: http://optimizer:8002
      SUPPLYMIZE_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      forecasting:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, backend]

  forecasting:
    build:
      context: services/forecasting
    image: supplymize/forecasting:local
    environment:
      SUPPLYMIZE_FORECAST_HOST: 0.0.0.0
      SUPPLYMIZE_FORECAST_PORT: "8001"
      SUPPLYMIZE_FORECAST_LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks: [backend]

  optimizer:
    build:
      context: services/optimizer
    image: supplymize/optimizer:local
    environment:
      SUPPLYMIZE_OPTIMIZER_ADDR: 0.0.0.0:8002
      SUPPLYMIZE_LOG_FORMAT: json
      RUST_LOG: supplymize_optimizer=info,tower_http=info
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: supplymize-local
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [backend]

networks:
  edge:
  backend:
    internal: true
