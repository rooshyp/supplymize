global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:8080"]

  - job_name: forecasting
    static_configs:
      - targets: ["forecasting:8001"]

  - job_name: optimizer
    static_configs:
      - targets: ["optimizer:8002"]
