apiVersion: v1
kind: ConfigMap
metadata:
  name: supplymize-config
data:
  SUPPLYMIZE_ENV: production
  SUPPLYMIZE_HTTP_ADDR: ":8080"
  SUPPLYMIZE_FORECAST_URL: http://forecasting:8080
  SUPPLYMIZE_OPTIMIZER_URL: http://optimizer:8082
  SUPPLYMIZE_LOG_LEVEL: info
  SUPPLYMIZE_FORECAST_HOST: 0.0.0.0
  SUPPLYMIZE_FORECAST_PORT: "8080"
  SUPPLYMIZE_FORECAST_ENVIRONMENT: production
  SUPPLYMIZE_FORECAST_LOG_LEVEL: INFO
  SUPPLYMIZE_OPTIMIZER_ADDR: 0.0.0.0:8082
  SUPPLYMIZE_LOG_FORMAT: json
  RUST_LOG: supplymize_optimizer=info,tower_http=info
