apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: supplymize
resources:
  - namespace.yaml
  - service-accounts.yaml
  - configmap.yaml
  - workloads.yaml
  - services.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: supplymize
    includeSelectors: true
    includeTemplates: true
