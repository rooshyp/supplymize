name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @supplymize/console test
      - run: pnpm --filter @supplymize/console build

  control-plane:
    name: Go control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/control-plane/go.mod
          cache-dependency-path: services/control-plane/go.mod
      - run: gofmt -d . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath ./cmd/control-plane

  forecasting:
    name: Python forecasting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/forecasting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/forecasting/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=supplymize_forecasting --cov-report=term-missing

  optimizer:
    name: Rust optimizer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/optimizer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/optimizer
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --locked

  containers:
    name: Containers and integration smoke
    runs-on: ubuntu-latest
    needs: [web, control-plane, forecasting, optimizer]
    steps:
      - uses: actions/checkout@v6
      - run: docker build --file apps/console/Dockerfile --tag supplymize/console:local .
      - run: docker build --file services/control-plane/Dockerfile --tag supplymize/control-plane:local services/control-plane
      - run: docker build --file services/forecasting/Dockerfile --tag supplymize/forecasting:local services/forecasting
      - run: docker build --file services/optimizer/Dockerfile --tag supplymize/optimizer:local services/optimizer
      - name: Start planning services
        run: docker compose up --detach --no-build forecasting optimizer control-plane
      - name: Verify end-to-end planning
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/readyz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:8080/readyz
          curl --fail-with-body \
            --request POST http://localhost:8080/v1/plans \
            --header 'Content-Type: application/json' \
            --header 'X-Request-ID: ci-smoke-001' \
            --data @examples/plan-request.json \
            --output /tmp/supplymize-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/supplymize-plan.json').read_text())
          assert plan['request_id'] == 'ci-smoke-001'
          demand = plan['forecast']['total_demand']
          accounted = (
              plan['optimization']['fulfilled_demand']
              + plan['optimization']['unfulfilled_demand']
          )
          assert abs(demand - accounted) < 1e-6
          assert plan['optimization']['costs']['total'] >= 0
          PY
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop planning services
        if: always()
        run: docker compose down --volumes --remove-orphans
